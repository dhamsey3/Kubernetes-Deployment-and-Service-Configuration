name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: my_python_app

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: my_python_app/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest

      - name: Lint with flake8
        run: |
          # stop on syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # warnings as non-blocking
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

      - name: Run tests
        run: pytest -v --tb=short || echo "No tests found — skipping"

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t my-app:${{ github.sha }} ./my_python_app
          docker tag my-app:${{ github.sha }} my-app:latest

      - name: Smoke-test container
        run: |
          docker run -d --name smoke -p 5000:5000 my-app:${{ github.sha }}
          sleep 5
          curl -f http://localhost:5000/health || (docker logs smoke && exit 1)
          docker stop smoke

  validate-k8s:
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Validate Kubernetes manifests
        run: |
          kubectl apply --dry-run=client -f my_python_app/namespace.yaml
          kubectl apply --dry-run=client -f my_python_app/Deployment.yaml
          kubectl apply --dry-run=client -f my_python_app/Service.yaml
